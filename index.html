<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CH Sales">
<title>CH Sales Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3F4F2;
  --surface: #FFFFFF;
  --ink: #000000;
  --text: #26272A;
  --muted: #62676D;
  --line: #DCDFDA;
  --line-strong: #BFC4BF;
  --yellow: #FFE400;
  --yellow-soft: #FFF8BF;
  --red: #D92D20;
  --red-soft: #FFF3F1;
  --amber: #E07B00;
  --amber-soft: #FFF1DE;
  --green: #1F8F55;
  --green-soft: #E3F4EA;
  --blue-soft: #E7EFFA;
  --grey: #A3A8AE;
  --grey-soft: #ECEEEB;
  --font: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --top-h: 58px;
  --nav-h: 64px;
  --rail-w: 200px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { color: var(--ink); font-stretch: 125%; font-weight: 800; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- chrome ---------- */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 4px solid var(--yellow);
  display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px; min-height: var(--top-h); }
.top .logo { height: 34px; width: auto; display: block; }
.sync { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--muted);
  background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 6px 11px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex: none; }
.dot.pending { background: var(--amber); }
.dot.off { background: var(--grey); }
.dot.err { background: var(--red); }
.dot.busy { animation: pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.me { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--yellow); display: grid; place-items: center;
  font-weight: 800; font-size: 14px; text-decoration: none; flex: none; }
.content main { max-width: 880px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px); }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom, 0px); height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
.nav a { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none; }
.nav a svg { width: 24px; height: 24px; }
.nav a.on { color: var(--ink); }
.nav a.on::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 3px; background: var(--ink); border-radius: 0 0 3px 3px; }
.nav a.add .plus { width: 54px; height: 54px; margin-top: -26px; border-radius: 14px; background: var(--yellow); color: var(--ink);
  display: grid; place-items: center; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--ink); }
.nav a.add .plus svg { width: 26px; height: 26px; }
.nav a.add.on::before { display: none; }
body.locked .nav, body.locked .top { display: none; }

@media (min-width: 960px) {
  .nav { top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); bottom: 0; right: auto; width: var(--rail-w); height: auto; flex-direction: column;
    justify-content: flex-start; gap: 4px; padding: 18px 12px; border-top: 0; border-right: 1px solid var(--line); }
  .nav a { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 11px 12px; font-size: 15px; border-radius: 8px; }
  .nav a.on { background: var(--grey-soft); }
  .nav a.on::before { top: 8px; bottom: 8px; left: -12px; right: auto; width: 4px; height: auto; border-radius: 0 3px 3px 0; }
  .nav a.add { order: -1; margin-bottom: 10px; background: var(--yellow); color: var(--ink); border: 1.5px solid var(--ink); }
  .nav a.add .plus { width: auto; height: auto; margin: 0; border: 0; box-shadow: none; background: none; border-radius: 0; }
  .nav a.add .plus svg { width: 22px; height: 22px; }
  .content, #banner { padding-left: var(--rail-w); }
  body.locked .content { padding-left: 0; }
  .content main { padding-bottom: 48px; }
  #toasts { bottom: 24px !important; }
}

.bar { display: flex; align-items: center; gap: 10px; padding: 9px 16px; font-size: 14px; font-weight: 600; }
.bar.trade { background: var(--ink); color: var(--yellow); }
.bar.trade button { margin-left: auto; background: var(--yellow); color: var(--ink); border: 0; border-radius: 6px; padding: 5px 10px; font-weight: 700; font-size: 13px; }
.bar.demo { background: var(--yellow-soft); color: var(--ink); font-weight: 500; }
.bar.shut { background: var(--blue-soft); color: #1D4E89; }

/* ---------- common ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 16px; border-radius: 8px;
  border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none; line-height: 1.15; text-align: center; }
.btn.primary { background: var(--yellow); }
.btn.dark { background: var(--ink); color: #fff; }
.btn.ghost { border-color: var(--line-strong); }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btnrow > .btn { flex: 1 1 140px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.hint { font-size: 14px; color: var(--muted); margin: 4px 0 10px; }
.page-head { margin: 4px 0 18px; }
.page-head h1 { font-size: 28px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600; color: var(--muted); text-decoration: none; margin-bottom: 8px; }
.back svg { width: 18px; height: 18px; }
.sec { font-size: 20px; margin: 30px 0 12px; display: flex; align-items: baseline; gap: 10px; }
.sec a, .sec button { margin-left: auto; font-size: 14px; font-weight: 600; font-stretch: 100%; color: var(--muted); background: none; border: 0; padding: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.empty { text-align: center; padding: 34px 18px; background: var(--surface); border: 1.5px dashed var(--line-strong); border-radius: 12px; }
.empty h3 { font-size: 18px; margin-bottom: 6px; }
.empty p { margin: 0 0 14px; color: var(--muted); }
.warn { background: var(--amber-soft); border: 1px solid #F3C98B; color: #6B3A00; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
.warn a { font-weight: 700; }

/* ---------- cards ---------- */
.card { position: relative; display: flex; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 12px 12px 20px; cursor: pointer; overflow: hidden; }
.card + .card { margin-top: 8px; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--stud, var(--line-strong)); }
.card.fu-overdue { background: var(--red-soft); border-color: #F5C2BC; }
.card.fu-today { background: #FFFDE6; border-color: #F0DE6C; }
.fu-overdue { --stud: var(--red); }
.fu-today { --stud: var(--yellow); }
.fu-week { --stud: var(--amber); }
.fu-ok { --stud: var(--green); }
.fu-none { --stud: var(--line-strong); }
.card-body { flex: 1; min-width: 0; }
.card-title { display: flex; align-items: center; gap: 6px; }
.co { font-weight: 800; font-size: 17px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-sub { font-size: 14px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.card-side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 8px; }
.callbtn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.callbtn svg { width: 18px; height: 18px; }
.owner { font-size: 11px; font-weight: 700; color: var(--muted); }

.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.badge.fu-overdue { background: var(--red); color: #fff; }
.badge.fu-today { background: var(--yellow); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.badge.fu-week { background: var(--amber-soft); color: #7A4100; }
.badge.fu-ok { background: var(--green-soft); color: #15603A; }
.badge.fu-none { background: var(--grey-soft); color: var(--muted); }

.pchip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: var(--ink); color: var(--yellow); white-space: nowrap; }
.pchip.maybe { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); border-radius: 4px; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--grey-soft); color: var(--text); white-space: nowrap; }
.st-interested { background: var(--green-soft); color: #15603A; }
.st-maybe { background: var(--yellow-soft); color: #5C4B00; }
.st-callback { background: var(--blue-soft); color: #1D4E89; }
.st-not, .st-lost { background: var(--grey-soft); color: var(--muted); }
.st-quote { background: #F1E8FB; color: #5B2A86; }
.st-won { background: var(--ink); color: var(--yellow); }

/* ---------- home ---------- */
.hello { margin: 6px 0 16px; }
.hello h1 { font-size: 30px; }
.hello p { margin: 4px 0 0; color: var(--muted); }
.run { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.run-top { display: flex; align-items: flex-end; gap: 14px; }
.run .big { font-stretch: 125%; font-weight: 900; font-size: 72px; line-height: 0.82; color: var(--ink); }
.run .lbl { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; color: var(--ink); padding-bottom: 2px; }
.run .lbl span { display: block; font-weight: 500; font-size: 14px; color: var(--muted); }
.scope { flex: none; margin-left: auto; display: flex; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; align-self: flex-start; }
.scope button { border: 0; background: var(--surface); padding: 6px 10px; font-size: 13px; font-weight: 700; }
.scope button.on { background: var(--ink); color: #fff; }
.beam { position: relative; display: flex; height: 16px; border-radius: 3px; overflow: hidden; margin: 18px 0 12px; background: var(--grey-soft); }
.beam span { display: block; height: 100%; }
.beam::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 22px, rgba(255,255,255,0.7) 22px 24px); pointer-events: none; }
.legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.legend button { border: 0; background: none; padding: 4px 0; text-align: left; }
.legend b { display: block; font-size: 22px; font-stretch: 125%; color: var(--ink); line-height: 1.1; }
.legend span { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 620px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font-size: 26px; font-stretch: 125%; font-weight: 800; color: var(--ink); line-height: 1.15; }
.stat span { font-size: 13px; color: var(--muted); }
.prow { display: grid; grid-template-columns: 120px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; }
.prow .lab { font-weight: 700; color: var(--ink); }
.track { display: flex; height: 12px; background: var(--grey-soft); border-radius: 2px; overflow: hidden; }
.track .y { background: var(--ink); }
.track .m { background: repeating-linear-gradient(135deg, var(--ink) 0 2px, var(--yellow) 2px 6px); }
.prow .n { font-size: 13px; color: var(--muted); white-space: nowrap; }
.whois { display: flex; gap: 8px; }
.whois input { flex: 1; }

/* ---------- lists ---------- */
.search { position: relative; margin-bottom: 12px; }
.search input { padding-left: 40px; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.tabs { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding: 2px 16px 10px; margin: 0 -16px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 7px 13px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.tab .n { margin-left: 5px; font-size: 12px; opacity: 0.7; }
.filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.filters select { padding: 9px 10px; font-size: 14px; }
.count { font-size: 13px; color: var(--muted); margin: 0 0 8px; }

/* ---------- forms ---------- */
input, select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--surface); border: 1.5px solid var(--line-strong);
  border-radius: 8px; padding: 11px 12px; min-height: 46px; }
textarea { min-height: 88px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--yellow); }
input[type="checkbox"] { width: 22px; height: 22px; min-height: 0; accent-color: var(--ink); flex: none; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
.field small { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 > * { min-width: 0; }
input[type="date"] { min-width: 0; -webkit-appearance: none; appearance: none; display: block; }
@media (max-width: 420px) { .row2.stack { grid-template-columns: 1fr; } }
.fsec { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.fsec h2 { font-size: 18px; margin-bottom: 12px; }
.fsec h3.sub { font-size: 15px; font-stretch: 100%; margin: 16px 0 8px; }
.fsec.more summary { font-weight: 800; font-stretch: 125%; font-size: 18px; color: var(--ink); cursor: pointer; list-style: none; display: flex; align-items: center; }
.fsec.more summary::after { content: "+"; margin-left: auto; font-size: 24px; line-height: 1; }
.fsec.more[open] summary::after { content: "\2212"; }
.fsec.more[open] summary { margin-bottom: 14px; }
.person { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #FBFBFA; }
.person-head { display: flex; align-items: center; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
.person-head button { margin-left: auto; border: 0; background: none; color: var(--red); font-size: 14px; font-weight: 600; padding: 4px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 auto; min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 8px; font-weight: 600; font-size: 15px; }
.seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 380px) { .pgrid { grid-template-columns: 1fr; } }
.ptog { display: flex; align-items: center; gap: 10px; min-height: 54px; border: 1.5px solid var(--line-strong); border-radius: 10px; padding: 10px 12px;
  background: var(--surface); width: 100%; text-align: left; font-weight: 700; color: var(--ink); }
.ptog .box { width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--line-strong); display: grid; place-items: center; font-weight: 900; flex: none; }
.ptog .st { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
.ptog.yes { background: var(--yellow); border-color: var(--ink); }
.ptog.yes .box { background: var(--ink); border-color: var(--ink); color: var(--yellow); }
.ptog.yes .st { color: var(--ink); }
.ptog.maybe { border-color: var(--ink); border-style: dashed; }
.ptog.maybe .box { border-color: var(--ink); border-style: dashed; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-top: 4px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.nchip { border: 1px solid var(--line-strong); background: var(--grey-soft); border-radius: 99px; padding: 6px 11px; font-size: 13px; font-weight: 600; }
.savebar { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px); display: flex; gap: 8px; padding: 10px; margin-top: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; z-index: 5; }
.savebar .btn { flex: 1; }
.savebar .btn.primary { flex: 2; }
@media (min-width: 960px) { .savebar { bottom: 12px; } }
.fu-hint { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 4px; }
.fu-hint button { border: 0; background: none; text-decoration: underline; font-size: 13px; color: var(--ink); padding: 0; }

/* ---------- detail ---------- */
.dhead h1 { font-size: 30px; word-break: break-word; }
.dhead .meta { color: var(--muted); margin-top: 4px; }
.dhead .chips { margin-top: 10px; }
.dhead-top { display: flex; align-items: flex-start; gap: 10px; }
.dhead-top .btn { margin-left: auto; flex: none; }
.fupanel { border-radius: 12px; padding: 14px 14px 14px 20px; margin: 16px 0; background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden; }
.fupanel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--stud, var(--line-strong)); }
.fupanel.fu-overdue { background: var(--red-soft); border-color: #F5C2BC; }
.fupanel.fu-today { background: #FFFDE6; border-color: #F0DE6C; }
.fupanel .when { font-size: 22px; font-weight: 800; font-stretch: 125%; color: var(--ink); }
.fupanel .why { font-size: 14px; color: var(--muted); margin: 2px 0 12px; }
.people .p { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.people .p:first-child { border-top: 0; padding-top: 0; }
.people .who { flex: 1; min-width: 0; }
.people .who b { display: block; color: var(--ink); }
.people .who span { display: block; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--surface); display: grid; place-items: center; color: var(--ink); flex: none; }
.iconbtn.y { background: var(--yellow); }
.iconbtn svg { width: 19px; height: 19px; }
dl.facts { display: grid; grid-template-columns: minmax(110px, 35%) 1fr; gap: 0; margin: 0; }
dl.facts dt, dl.facts dd { padding: 9px 0; border-top: 1px solid var(--line); margin: 0; font-size: 15px; }
dl.facts dt { color: var(--muted); padding-right: 10px; }
dl.facts dd { color: var(--ink); font-weight: 500; word-break: break-word; }
dl.facts > :nth-child(1), dl.facts > :nth-child(2) { border-top: 0; }
.notes { white-space: pre-wrap; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.photos button, .photos label { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); background: var(--grey-soft) center/cover no-repeat; padding: 0; }
.photos label { display: grid; place-items: center; border: 1.5px dashed var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; text-align: center; padding: 6px; }
.photos label input { display: none; }
.tl { list-style: none; margin: 0 0 0 7px; padding: 0; border-left: 2px solid var(--line); }
.tl li { position: relative; padding: 0 0 16px 18px; }
.tl li::before { content: ""; position: absolute; left: -8px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
.tl li.won::before { background: var(--yellow); }
.tl li.edit::before { border-color: var(--line-strong); }
.tl .what { font-weight: 700; color: var(--ink); }
.tl .note { margin-top: 2px; white-space: pre-wrap; }
.tl .meta { font-size: 13px; color: var(--muted); }
.tl li.edit .what { font-weight: 600; color: var(--muted); font-size: 14px; }

/* ---------- map ---------- */
#map { height: calc(100dvh - var(--top-h) - var(--nav-h) - 230px); min-height: 330px; border-radius: 12px; border: 1px solid var(--line); background: var(--grey-soft); z-index: 1; }
@media (min-width: 960px) { #map { height: calc(100dvh - var(--top-h) - 220px); } }
.maplegend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); margin: 10px 0; }
.maplegend span { display: inline-flex; align-items: center; gap: 5px; }
.maplegend i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }
.routebox { margin-top: 12px; }
.routebox ol { margin: 8px 0 12px; padding-left: 22px; }
.routebox li { padding: 3px 0; }
.routebox li button { border: 0; background: none; color: var(--red); font-size: 13px; font-weight: 600; margin-left: 6px; }
.leaflet-popup-content { font-family: var(--font); font-size: 14px; margin: 12px 14px; }
.leaflet-popup-content b { font-size: 15px; }
.popbtns { display: flex; gap: 6px; margin-top: 8px; }
.popbtns button { flex: 1; border: 1.5px solid var(--ink); background: var(--surface); border-radius: 6px; padding: 6px 8px; font-weight: 700; font-size: 13px; }
.popbtns button.y { background: var(--yellow); }

/* ---------- more / scoreboard / cheat sheet ---------- */
.menu { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.menu > a, .menu > button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line);
  background: none; padding: 15px 16px; font-weight: 600; text-decoration: none; color: var(--ink); }
.menu > :first-child { border-top: 0; }
.menu .em { font-size: 20px; width: 26px; text-align: center; }
.menu small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.menu .chev { margin-left: auto; color: var(--muted); }
.board li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.board li:first-child { border-top: 0; }
.board ol { list-style: none; margin: 0; padding: 0; }
.board .rank { width: 34px; font-size: 22px; text-align: center; font-weight: 800; font-stretch: 125%; color: var(--muted); }
.board .nm { flex: 1; }
.board .nm b { display: block; color: var(--ink); }
.board .nm span { font-size: 13px; color: var(--muted); }
.board .pts { font-size: 26px; font-weight: 900; font-stretch: 125%; color: var(--ink); }
.board .pts small { font-size: 12px; font-weight: 600; color: var(--muted); font-stretch: 100%; margin-left: 2px; }
.board li.first { background: var(--yellow-soft); margin: 0 -16px; padding: 14px 16px; border-top: 0; }
.cheat details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
.cheat summary { padding: 14px 16px; font-weight: 700; color: var(--ink); cursor: pointer; list-style: none; display: flex; gap: 10px; }
.cheat summary::before { content: "\201C"; font-size: 26px; line-height: 0.8; font-stretch: 125%; font-weight: 900; color: var(--ink); background: var(--yellow); width: 26px; height: 26px; border-radius: 4px; display: grid; place-items: center; padding-top: 8px; flex: none; }
.cheat details p { margin: 0; padding: 0 16px 16px 52px; }

/* ---------- login ---------- */
.login { max-width: 420px; margin: 8vh auto 0; text-align: center; }
.login .biglogo { width: min(100%, 340px); height: auto; margin: 0 auto 26px; display: block; }
.login h1 { font-size: 26px; margin-bottom: 6px; }
.login p { color: var(--muted); margin: 0 0 22px; }
.login .field { text-align: left; }
.login .err { color: var(--red); font-weight: 600; min-height: 1.4em; margin-top: 12px; }
.names { display: grid; gap: 8px; }
.names button { min-height: 56px; border: 1.5px solid var(--ink); background: var(--surface); border-radius: 10px; font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 12px; padding: 0 14px; }
.names button .me { width: 34px; height: 34px; font-size: 13px; }

/* ---------- modal / toast ---------- */
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92dvh; overflow: auto; border-radius: 16px 16px 0 0;
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 620px) { .modal-back { align-items: center; } .sheet { border-radius: 16px; } }
.sheet h3 { font-size: 21px; margin-bottom: 4px; }
.sheet .sub { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
.sheet .lbl { font-weight: 700; font-size: 14px; color: var(--ink); margin: 16px 0 7px; }
.sheet .acts { display: flex; gap: 8px; margin-top: 18px; }
.sheet .acts .btn { flex: 1; }
.sheet .acts .btn.primary { flex: 2; }
.optlist { display: grid; gap: 8px; }
.optlist .btn { justify-content: flex-start; }
.lightbox img { width: 100%; border-radius: 10px; display: block; }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 14px); z-index: 60;
  display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
.toast { pointer-events: auto; background: var(--ink); color: #fff; border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; font-size: 15px; font-weight: 500;
  animation: rise 0.18s ease-out; }
.toast button { margin-left: auto; background: var(--yellow); color: var(--ink); border: 0; border-radius: 6px; padding: 6px 11px; font-weight: 700; white-space: nowrap; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; width: 100%; height: 100%; display: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

/* ---------- follow-up rules ---------- */
function inShutdown(s) {
  const a = setting('Shutdown Start (MM-DD)'), b = setting('Shutdown End (MM-DD)');
  if (!/^\d\d-\d\d$/.test(a) || !/^\d\d-\d\d$/.test(b)) return false;
  const md = s.slice(5);
  return a <= b ? (md >= a && md <= b) : (md >= a || md <= b);
}
function afterShutdown(s) {
  if (!inShutdown(s)) return s;
  const b = setting('Shutdown End (MM-DD)');
  let y = +s.slice(0, 4);
  if (s.slice(5) > b) y += 1;
  return addDays(`${y}-${b}`, 1);
}
function workday(s) { const d = parseD(s); while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1); return dstr(d); }
function addWorkdays(s, n) { const d = parseD(s); while (n > 0) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) n--; } return dstr(d); }
const plan = s => workday(afterShutdown(s));
function autoFollowUp(status, stage, base) {
  base = isDate(base) ? base : today();
  if (base < today()) base = today();
  if (stage === 'Won') return { date: plan(addDays(base, num('Review Days', 30))), type: 'review' };
  if (stage === 'Lost' || status === 'Not interested') return { date: plan(addMonths(base, num('Revisit Months', 6))), type: 'revisit' };
  if (status === 'Call back later') return { date: plan(addWorkdays(base, 2)), type: 'callback' };
  return { date: plan(addDays(base, num('Follow-up Days', 7))), type: 'followup' };
}
const KIND = { followup: 'Follow up', callback: 'Call back', review: 'Ask for a review', revisit: 'Revisit' };
function fu(c) {
  const kind = KIND[c.followUpType] || 'Follow up';
  if (c.archived) return { state: 'none', label: 'Archived', short: 'Archived', kind };
  if (!isDate(c.nextFollowUp)) return { state: 'none', label: 'No follow-up set', short: 'No follow-up', kind };
  const d = diffDays(c.nextFollowUp, today());
  if (d < 0) return { state: 'overdue', d, kind, label: `Overdue by ${plural(-d, 'day')}`, short: `${-d}d overdue` };
  if (d === 0) return { state: 'today', d, kind, label: 'Due today', short: 'Today' };
  if (d === 1) return { state: 'week', d, kind, label: 'Due tomorrow', short: 'Tomorrow' };
  if (d <= 7) return { state: 'week', d, kind, label: `Due ${fmtDate(c.nextFollowUp)}`, short: DAYS[parseD(c.nextFollowUp).getDay()] };
  if (c.followUpType === 'revisit') return { state: 'none', d, kind, label: `Revisit in ${fmtMonth(c.nextFollowUp)}`, short: `Revisit ${MONTHS[parseD(c.nextFollowUp).getMonth()]}` };
  const nd = parseD(c.nextFollowUp);
  return { state: 'ok', d, kind, label: `Next follow-up ${fmtDate(c.nextFollowUp)}`, short: `${nd.getDate()} ${MONTHS[nd.getMonth()]}` };
}

  if (URGENCY[fa.state] !== URGENCY[fb.state]) return URGENCY[fa.state] - URGENCY[fb.state];

}

/* ---------- API & sync ---------- */
async function api(action, body = {}, passcode) {
  const res = await fetch(CONFIG.SCRIPT_URL, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, passcode: passcode ?? S.passcode, user: S.user }, body)),
  });
  let data;
  try { data = await res.json(); } catch (e) { throw new Error('The Google Sheet sent back something unexpected. Check the link in index.html.'); }
  if (!data.ok) throw new Error(data.error || 'Request failed');
  return data;
}
let syncTimer;
function queue(op) {

}
function upsertLocal(c) { const i = S.contacts.findIndex(x => x.id === c.id); if (i >= 0) S.contacts[i] = c; else S.contacts.push(c); }
function saveContact(c) { c.updatedAt = new Date().toISOString(); upsertLocal(c); queue({ op: 'saveContact', contact: clone(c) }); }
function addActivity(a) {
  a.id = a.id || uid(); a.at = a.at || new Date().toISOString(); a.user = a.user || S.user;
  S.activity.push(a); queue({ op: 'addActivity', activity: a });
}
function applyOpLocal(op) {
  if (op.op === 'saveContact') upsertLocal(clone(op.contact));
  else if (op.op === 'addActivity') { if (!S.activity.some(a => a.id === op.activity.id)) S.activity.push(op.activity); }
  else if (op.op === 'uploadPhoto') { if (!S.photos.some(p => p.id === op.photo.id)) S.photos.push({ id: op.photo.id, contactId: op.photo.contactId, at: op.photo.at, user: op.photo.user, local: op.photo.dataUrl }); }
}
function applyServerData(d) {
  if (!d) return;
  S.contacts = (d.contacts || []).map(c => Object.assign({ people: [], products: {} }, c));
  S.activity = d.activity || [];
  S.photos = d.photos || [];
  S.outbox.forEach(applyOpLocal);
}
async function sync(manual) {
  if (S.demo) { S.outbox = []; persist(); updateSyncUI(); if (manual) toast('Demo mode: everything is saved on this device only.'); return; }
  if (!S.passcode || !S.user) return;
  if (S.syncing) { S.resync = true; return; }
  if (!navigator.onLine) { updateSyncUI(); if (manual) toast("You're offline. Changes will sync when you're back in coverage."); return; }
  S.syncing = true; updateSyncUI();
  try {
    let loops = 0;
    do {
      S.resync = false;
      const ops = S.outbox.slice(0, 15);
      const res = ops.length ? await api('sync', { ops }) : await api('getAll');
      if (ops.length) {
        const done = new Set();
        (res.results || []).forEach(r => {
          const op = ops.find(o => o.opId === r.opId); if (!op) return;
          if (r.ok) done.add(r.opId);
          else { op.tries = (op.tries || 0) + 1; if (op.tries >= 4) { done.add(r.opId); toast("A change couldn't be saved to the Sheet: " + r.error); } }
        });
        S.outbox = S.outbox.filter(o => !done.has(o.opId));
      }
      applyServerData(res.data);
      loops++;
    } while ((S.outbox.length || S.resync) && loops < 8 && navigator.onLine);
    S.lastSync = new Date().toISOString(); S.syncError = '';
    if (manual) toast('Synced with the Google Sheet');
  } catch (e) {
    S.syncError = e.message || 'Sync failed';
    if (S.syncError === 'bad_passcode') {
      S.passcode = ''; store.set('passcode', '');
      S.syncing = false; renderLogin('The team passcode has changed. Enter the new one to keep syncing.');
      return;
    }

  }
}
function updateSyncUI() {
  const el = $('#sync'); if (!el) return;

  if (S.demo) { cls = 'pending'; txt = 'Demo'; }
  else if (!navigator.onLine) { cls = 'off'; txt = n ? `Offline, ${n} waiting` : 'Offline'; }
  else if (S.syncing) { cls = 'pending busy'; txt = 'Syncing'; }

function scores(from) {
  const iso = from.toISOString(), out = {};
  const add = (u, k, n) => { if (!u) return; out[u] = out[u] || { name: u, contacts: 0, leads: 0, quotes: 0, wins: 0, points: 0 }; out[u][k]++; out[u].points += n; };
  teamNames().forEach(n => { out[n] = { name: n, contacts: 0, leads: 0, quotes: 0, wins: 0, points: 0 }; });
  S.activity.filter(a => a.at >= iso).forEach(a => {
    if (a.type === 'Won') add(a.user, 'wins', 10);
    else if (a.type !== 'Edit') { add(a.user, 'contacts', 1); if (a.outcome === 'Quote sent') add(a.user, 'quotes', 3); }
  });
  S.contacts.filter(c => c.createdAt && c.createdAt >= iso).forEach(c => add(c.createdBy, 'leads', 2));
  return Object.values(out).sort((a, b) => b.points - a.points || a.name.localeCompare(b.name));
}

  const total = cnt.overdue + cnt.today + cnt.week + cnt.ok;

  const won = all.filter(c => c.stage === 'Won').length, lost = all.filter(c => c.stage === 'Lost').length;
  const winRate = won + lost ? Math.round((won / (won + lost)) * 100) + '%' : 'None yet';

    return { p, y, m };
  });
  const maxP = Math.max(1, ...prodRows.map(r => r.y + r.m));
  const top = scores(weekStart()).slice(0, 3).filter(s => s.points > 0);

  return `
  <div class="hello"><h1>${greet}, ${esc(firstName(S.user))}</h1><p>${LONG_DAYS[now.getDay()]} ${now.getDate()} ${LONG_MONTHS[now.getMonth()]}</p></div>
  <section class="run" aria-label="Today's follow-ups">

    <div class="beam" role="img" aria-label="${cnt.overdue} overdue, ${cnt.today} today, ${cnt.week} this week, ${cnt.ok} later">${seg('overdue')}${seg('today')}${seg('week')}${seg('ok')}</div>

  `;
}
function scoreLine(s) {
  const bits = [];
  if (s.contacts) bits.push(plural(s.contacts, 'contact'));
  if (s.leads) bits.push(plural(s.leads, 'new lead'));
  if (s.quotes) bits.push(plural(s.quotes, 'quote'));
  if (s.wins) bits.push(plural(s.wins, 'win'));
  return bits.join(', ') || 'Nothing logged yet';
}

function inTab(c, t) {
  if (t === 'archived') return !!c.archived;
  if (c.archived) return false;
  switch (t) {
    case 'all': return true;
    case 'due': return ['overdue', 'today', 'week'].includes(fu(c).state);
    case 'steel': case 'battens': case 'doors': case 'brackets': return !!(c.products && c.products[t]);
    case 'framesdoors': return !!(c.products && c.products.steel && c.products.doors);
    case 'hot': return c.temperature === 'Hot' && c.stage !== 'Won';
    case 'callback': return c.status === 'Call back later';
    case 'maybe': return c.status === 'Maybe';
    case 'not': return c.status === 'Not interested' || c.stage === 'Lost';
    case 'customers': return c.stage === 'Won';

}
function matchSearch(c, q) {
  if (!q) return true;
  const ql = q.toLowerCase().trim();
  const hay = [c.company, c.region, c.address, c.notes, c.supplier, c.event, c.referredBy, ...(c.people || []).flatMap(p => [p.name, p.email, p.role])].join(' ').toLowerCase();
  if (hay.includes(ql)) return true;
  const qd = digits(q);
  return qd.length >= 3 && (c.people || []).some(p => digits(p.phone).includes(qd));
}

function findDupes(d) {

  const emails = (d.people || []).map(p => String(p.email || '').trim().toLowerCase()).filter(Boolean);
  return S.contacts.filter(c => c.id !== d.id && (
    (nc.length >= 3 && normCo(c.company) === nc) ||
    (c.people || []).some(p => phones.includes(digits(p.phone)) || (p.email && emails.includes(p.email.trim().toLowerCase())))

}

const DIFF_FIELDS = [['company', 'Company'], ['region', 'Region'], ['address', 'Address'], ['customerType', 'Customer type'], ['status', 'Status'], ['temperature', 'Temperature'], ['stage', 'Stage'], ['reason', 'Reason'], ['nextFollowUp', 'Next follow-up'], ['lastContacted', 'Last contacted'], ['owner', 'Contacted by'], ['quoteAmount', 'Quote amount'], ['quoteDate', 'Quote date'], ['quoteLink', 'Quote link'], ['houses', 'Houses'], ['projectStart', 'Project start'], ['supplier', 'Current supplier'], ['source', 'Lead source'], ['event', 'Event'], ['referredBy', 'Referred by'], ['emailConsent', 'Email consent']];
function diffSummary(a, b) {
  const out = [];
  DIFF_FIELDS.forEach(([k, l]) => {
    const x = a[k] ?? '', y = b[k] ?? '';

      const show = v => k === 'emailConsent' ? (v ? 'yes' : 'no') : (isDate(v) ? fmtDate(v) : (v === '' ? 'blank' : v));
      out.push(`${l}: ${show(x)} to ${show(y)}`);

  });

  if (JSON.stringify(a.people || []) !== JSON.stringify(b.people || [])) out.push('Contact people updated');

function openLog(id, opts = {}) {

function logRecalc() {
  const L = S.log, c = getC(L.id); if (!L || !c || L.touched) return;
  if (L.channel === 'Note' && !L.outcome) { L.next = c.nextFollowUp || ''; L.type = c.followUpType || 'followup'; return; }
  const base = today(); let r;
  switch (L.outcome) {
    case 'Interested': case 'Maybe': r = autoFollowUp(L.outcome, c.stage === 'Lost' ? 'Lead' : c.stage, base); break;
    case 'Call back later': r = { date: plan(addWorkdays(base, 2)), type: 'callback' }; break;
    case 'Not interested': r = autoFollowUp('Not interested', c.stage, base); break;
    case 'Left voicemail': case 'No answer': r = { date: plan(addWorkdays(base, 2)), type: c.followUpType === 'review' ? 'review' : 'followup' }; break;
    case 'Quote sent': r = { date: plan(addWorkdays(base, 5)), type: 'followup' }; break;

  }
  L.next = r.date; L.type = r.type;
}

    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';

}

function fillTpl(str, vars) { return String(str || '').replace(/\{\{(\w+)\}\}/g, (m, k) => vars[k] ?? ''); }
function emailVars(c, person) {
  const prods = PRODUCTS.filter(p => c.products && c.products[p.key]);
  const T = templates();
  const paras = prods.map(p => { const pt = T[p.label]; if (!pt || !pt.body) return ''; const link = setting('Brochure: ' + p.label, ''); return fillTpl(pt.body, { brochure: link ? `\nMore info: ${link}` : '' }); }).filter(Boolean).join('\n\n');
  return {
    first_name: firstName(person.name) || 'there', contact_name: person.name || '', company: c.company || '',
    company_name: setting('Company Name', 'CH Engineering'), products: prods.length ? listJoin(prods.map(p => p.label.toLowerCase())) : 'our steel framing products',
    product_paragraphs: paras, sender: S.user, review_link: setting('Google Review Link', ''),
  };
}
function mailHref(email, t, vars) {
  const subject = fillTpl(t.subject, vars), body = fillTpl(t.body, vars).replace(/\n{3,}/g, '\n\n').trim();
  return `mailto:${String(email).trim()}?subject=${enc(subject)}&body=${enc(body)}`;
}
function openExternal(href) { const a = document.createElement('a'); a.href = href; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1400, s = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}
function icsFor(c) {
  const d = c.nextFollowUp.replace(/-/g, ''), e = addDays(c.nextFollowUp, 1).replace(/-/g, '');
  const p = primary(c);
  const escI = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
  const desc = [p.name, p.phone, p.email, PRODUCTS.filter(x => c.products[x.key]).map(x => x.label).join(', ')].filter(Boolean).join('\n');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//CH Engineering//Sales Tracker//EN', 'BEGIN:VEVENT', `UID:${c.id}-${d}@ch-sales-tracker`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '')}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${e}`,
    `SUMMARY:${escI((KIND[c.followUpType] || 'Follow up') + ': ' + c.company)}`, `DESCRIPTION:${escI(desc)}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}
function download(name, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportCsv() {
  const cols = [['Company', c => c.company], ['Region', c => c.region], ['Address', c => c.address], ['Customer Type', c => c.customerType],
    ['Contact', c => primary(c).name], ['Phone', c => primary(c).phone], ['Email', c => primary(c).email],
    ['Other Contacts', c => (c.people || []).slice(1).map(p => [p.name, p.phone, p.email].filter(Boolean).join(' ')).join(' | ')],
    ...PRODUCTS.map(p => [p.label, c => (c.products || {})[p.key] || '']),
    ['Status', c => c.status], ['Temperature', c => c.temperature], ['Stage', c => c.stage], ['Reason', c => c.reason],
    ['Last Contacted', c => c.lastContacted], ['Next Follow-up', c => c.nextFollowUp], ['Contacted By', c => c.owner],
    ['Lead Source', c => c.source], ['Event', c => c.event], ['Referred By', c => c.referredBy], ['Quote Amount', c => c.quoteAmount],
    ['Houses', c => c.houses], ['Project Start', c => c.projectStart], ['Current Supplier', c => c.supplier],
    ['Email Consent', c => c.emailConsent ? 'Yes' : 'No'], ['Notes', c => c.notes], ['Archived', c => c.archived ? 'Yes' : 'No']];
  const cell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [cols.map(c => c[0]).join(',')].concat(S.contacts.map(c => cols.map(col => cell(col[1](c))).join(',')));
  download(`ch-sales-tracker-${today()}.csv`, '\uFEFF' + rows.join('\r\n'), 'text/csv;charset=utf-8');

/* ---------- confetti 🎉 ---------- */
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  cv.style.display = 'block';
  const colours = ['#FFE400', '#000000', '#FFE400', '#BFC4BF', '#FFFFFF'];
  const bits = Array.from({ length: 170 }, () => ({ x: W / 2 + (Math.random() - 0.5) * 80, y: H * 0.35, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 15 - 4,
    w: 6 + Math.random() * 7, h: 3 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: colours[Math.floor(Math.random() * colours.length)] }));
  const start = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    bits.forEach(b => { b.vy += 0.42; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.strokeStyle = '#000'; ctx.lineWidth = 0.6;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); if (b.c === '#FFFFFF') ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore(); });
    if (t - start < 2600) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  })(start);
}

    openModal(`<h3>Add to home screen</h3>

      <p><b>iPhone:</b> open this page in Safari, tap the Share button, then "Add to Home Screen".</p>
      <p><b>Android:</b> open this page in Chrome, tap the ⋮ menu, then "Add to Home screen" or "Install app".</p>

  },

  async logout() {
    if (!(await ask('Sign out of this phone?', S.outbox.length ? `There are ${S.outbox.length} changes that haven't synced yet. Signing out will lose them.` : 'Your data stays safe in the Google Sheet.', 'Sign out'))) return;
    ['passcode', 'user', 'config', 'contacts', 'activity', 'photos', 'outbox', 'lastSync', 'route', 'trade'].forEach(k => store.remove(k));

  },
  async resetDemo() {
    if (!(await ask('Reset the demo?', 'This replaces everything on this device with fresh sample data.', 'Reset'))) return;

function setNext(id, date) {
  const c = clone(getC(id));
  c.nextFollowUp = isDate(date) ? date : '';
  c.followUpType = c.nextFollowUp ? (c.followUpType || 'followup') : '';
  saveContact(c);
  addActivity({ contactId: c.id, company: c.company, type: 'Edit', outcome: '', note: c.nextFollowUp ? `Follow-up moved to ${fmtDate(c.nextFollowUp)}` : 'Follow-up cleared' });
  closeModal(); toast(c.nextFollowUp ? `Follow-up set for ${fmtDate(c.nextFollowUp)}` : 'Follow-up cleared'); render();
}

/* =====================================================================
 *  EVENT WIRING
 * ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON') e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modalOpen) closeModal();
  if (e.key === 'Enter') {
    if (e.target.matches('[data-act="open"]')) A.open(e.target);
    else if (e.target.id === 'pc') A.login();
    else if (e.target.id === 'whois') A.whois();
    else if (e.target.id === 'typedname') A.pickTyped();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f && S.draft) {
    const v = el.type === 'checkbox' ? el.checked : el.value;
    setPath(S.draft, el.dataset.f, v);
    const f = el.dataset.f;
    if (f === 'nextFollowUp') { S.draft._fuTouched = true; $('#fu-hint').innerHTML = fuHint(S.draft); }
    if (f === 'lastContacted' && !S.draft._fuTouched) { recalcDraft(S.draft); const n = $('#f-next'); if (n) n.value = S.draft.nextFollowUp; $('#fu-hint').innerHTML = fuHint(S.draft); }
    if (f === 'stage') { recalcDraft(S.draft); rerenderForm(); }
    if (f === 'company' || f.startsWith('people.')) scheduleDupes();
    return;
  }
  if (el.dataset.q && S.quick) { S.quick[el.dataset.q] = el.type === 'checkbox' ? el.checked : el.value; return; }
  if (el.dataset.lf && S.log) {
    if (el.dataset.lf === 'next') { S.log.next = el.value; S.log.touched = true; S.log.type = S.log.type || 'followup'; }
    else S.log[el.dataset.lf] = el.value;
    return;
  }
  if (el.id === 'search') { S.ui.search = el.value; persist(); renderList(); return; }
  if (el.id === 'cheatq') {
    const q = el.value.toLowerCase();
    document.querySelectorAll('#cheatlist details').forEach(d => { const hit = d.textContent.toLowerCase().includes(q); d.style.display = hit ? '' : 'none'; d.open = !!q && hit; });
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'f-owner') { S.ui.owner = el.value; persist(); renderList(); }
  else if (el.id === 'f-region') { S.ui.region = el.value; persist(); renderList(); }
  else if (el.id === 'f-sort') { S.ui.sort = el.value; persist(); renderList(); }
  else if (el.id === 'f-map') { S.ui.mapShow = el.value; persist(); drawMarkers(true); }
  else if (el.dataset.photo && el.files && el.files[0]) {
    const c = getC(el.dataset.photo);
    try {
      toast('Saving photo…');
      const dataUrl = await compressImage(el.files[0]);
      const photo = { id: uid(), contactId: c.id, company: c.company, at: new Date().toISOString(), user: S.user, dataUrl };
      S.photos.push({ id: photo.id, contactId: c.id, at: photo.at, user: S.user, local: dataUrl });
      queue({ op: 'uploadPhoto', photo });
      render();
    } catch (err) { toast("That photo couldn't be read. Try a different one."); }
  }
});
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.more') && S.draft) S.draft._moreOpen = e.target.open; }, true);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const p = S.pending;
  if (p && Date.now() - p.at > 3000 && Date.now() - p.at < 3 * 3600 * 1000 && getC(p.id) && !document.body.classList.contains('locked')) {
    S.pending = null; openLog(p.id, { channel: p.type, prompt: true });
  }
  sync();
});
window.addEventListener('online', () => { updateSyncUI(); sync(); });
window.addEventListener('offline', updateSyncUI);
window.addEventListener('hashchange', route);
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 120000);
setInterval(() => { if (S.view === 'home' && !S.modalOpen && document.visibilityState === 'visible') refreshView(); }, 600000);

/* =====================================================================

(function boot() {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

    S.config = DEMO_CONFIG;
    if (!store.get('seeded', false)) seedDemo();
